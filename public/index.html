<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Средневековая стратегия</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏰</text></svg>">
  <script>
    // Грузим Telegram SDK только если игра открыта внутри Telegram.
    // В обычном браузере запрос не выполняется — страница открывается мгновенно.
    if (window.Telegram || /Telegram/i.test(navigator.userAgent)) {
      const sdk = document.createElement("script");
      sdk.src = "https://telegram.org/js/telegram-web-app.js";
      document.head.appendChild(sdk);
    }
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <select id="lang">
      <option value="ru">Русский</option>
      <option value="en">English</option>
    </select>

    <!-- Меню -->
    <section id="menuScreen">
      <h1 id="menuTitle">Средневековая стратегия</h1>

      <div class="menuBox">
        <input id="nickname" type="text" maxlength="24">

        <div class="menuRow">
          <button id="createRoomBtn">Создать комнату</button>
          <button id="joinRoomBtn">Войти</button>
          <input id="roomCodeInput" type="text" maxlength="4">
        </div>

        <div id="resumeCards"></div>

        <p id="menuStatus"></p>
      </div>
    </section>

    <!-- Лобби -->
    <section id="lobbyScreen" class="hidden">
      <h1 id="lobbyTitle">Лобби</h1>
      <div id="roomCodeDisplay"></div>

      <h2 id="playersLabel">Игроки</h2>
      <ul id="playerList"></ul>

      <canvas id="mapPreview" width="180" height="180"></canvas>
      <div id="mapInfo"></div>

      <div class="menuRow">
        <label id="mapLabel" for="mapSelect"></label>
        <select id="mapSelect"></select>
      </div>

      <div class="menuRow">
        <button id="readyBtn">Готов</button>
        <button id="startBtn">Начать игру</button>
      </div>

      <button id="leaveRoomBtn">Покинуть комнату</button>

      <p id="lobbyStatus"></p>
    </section>

    <!-- Игра -->
    <section id="gameScreen" class="hidden">
      <button id="saveGameBtn">💾 Сохранить</button>

      <div id="topBar">
        <div id="turnInfo"></div>
        <div id="timer"></div>
        <button id="endTurn">Завершить ход</button>
      </div>

      <div id="resources"></div>
      <div id="recruitPanel"></div>

      <div id="gameContainer">
        <div id="netStatus"></div>
        <canvas id="game" width="1280" height="1280"></canvas>
      </div>

      <p id="info">Кликни по клетке</p>
    </section>

    <!-- Оверлей завершения игры -->
    <div id="gameOverOverlay" class="hidden">
      <div class="overlay-content">
        <h2 id="gameOverText">Игра окончена</h2>
        <p id="gameOverReason"></p>
        <button id="playAgainBtn">Играть снова</button>
      </div>
    </div>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
